  <script>
    (function() {
      // SPA fallback for GitHub Pages: redirect to index.html with path preserved
      // The app uses BrowserRouter; on GH Pages under /bluebook/, we need to 
      // redirect to /bluebook/ with the original path so the router can handle it
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Detect repo base path from current URL
      // e.g., https://user.github.io/bluebook/takeexam/123 -> base is /bluebook/
      var segments = path.split('/').filter(Boolean);
      var repoPath = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      
      // If we're already at the repo root, don't redirect (avoid loop)
      if (path === repoPath || path === repoPath.slice(0, -1)) {
        return;
      }
      
      // Build redirect URL: repo root + encoded original path
      var redirectPath = path.slice(repoPath.length - 1); // e.g., /takeexam/123
      var redirectUrl = repoPath + '?redirect=' + encodeURIComponent(redirectPath + search + hash);
      
      // Use replace to avoid history entry for the 404 page
      window.location.replace(redirectUrl);
    })();
  </script>
